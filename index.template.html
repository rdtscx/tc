    <div class="search-row">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索站点、域名或实现方式…" autocomplete="off" aria-label="搜索站点">
      <button class="clear-search" id="clearSearch" type="button">清除</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toolbar-actions">
      <button class="btn btn-sm" type="button" id="copyAllSites">复制全部站点</button>
      <button class="btn btn-sm" type="button" id="copyAllSources">复制全部测速源</button>
    </div>
  </section>

  <section class="site-list" id="siteList" aria-live="polite"></section>
  <div class="empty" id="empty" hidden>没有匹配的站点，换个关键词或筛选条件试试。</div>
</main>

<footer class="site-footer">
  <div>整理自 <a href="https://xydh.fun/x1234" target="_blank" rel="noopener">xydh.fun/x1234</a>「流量消耗器」分类 · 页面风格参考 <a href="https://net.whiteyun.com/" target="_blank" rel="noopener">白云网络面板</a></div>
  <div>测速链接由各站点公开页面提取，可能随站点更新变化 · 托管于 GitHub Pages</div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var DATA = __DATA__;
</script>
<script>
(function () {
  'use strict';

  var sites = DATA.sites || [];
  var listEl = document.getElementById('siteList');
  var emptyEl = document.getElementById('empty');
  var chipsEl = document.getElementById('chips');
  var searchEl = document.getElementById('searchInput');
  var toastEl = document.getElementById('toast');
  var state = { query: '', filter: '全部', open: {} };

  var FILTERS = ['全部', '流式读取', 'axios 进度', '运营商定向', '全球测速', '流量上限'];

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function totalSources() {
    var n = 0;
    for (var i = 0; i < sites.length; i++) n += (sites[i].sources || []).length;
    return n;
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.top = '-1000px';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(area);
    return ok;
  }

  function matches(site) {
    if (state.filter !== '全部' && (site.tags || []).indexOf(state.filter) === -1) return false;
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    var hay = [site.name, site.host, site.url, site.impl, site.desc, site.threads]
      .concat(site.tags || [])
      .concat((site.defaults || []).map(function (x) { return x.label + ' ' + x.url; }))
      .join(' ').toLowerCase();
    if (hay.indexOf(q) !== -1) return true;
    var sources = site.sources || [];
    for (var i = 0; i < sources.length; i++) {
      if ((sources[i].label + ' ' + sources[i].url).toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
  }

  function renderChips() {
    var html = '';
    for (var i = 0; i < FILTERS.length; i++) {
      var f = FILTERS[i];
      html += '<button type="button" class="chip' + (state.filter === f ? ' active' : '') + '" data-filter="' + escapeHtml(f) + '">' + escapeHtml(f) + '</button>';
    }
    chipsEl.innerHTML = html;
  }

  function renderSources(site) {
    var rows = '';
    var list = site.sources || [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var url = escapeHtml(item.url);
      rows += '<div class="source-item">' +
        '<span class="source-label" title="' + escapeHtml(item.label) + '">' + escapeHtml(item.label) + '</span>' +
        '<a class="source-url" href="' + url + '" target="_blank" rel="noopener" title="' + url + '">' + url + '</a>' +
        '<span class="source-actions">' +
          '<button type="button" class="btn btn-sm" data-action="copy" data-url="' + url + '">复制</button>' +
          '<a class="btn btn-sm" href="' + url + '" target="_blank" rel="noopener">打开</a>' +
        '</span>' +
      '</div>';
    }
    return '<div class="sources" data-sources>' +
      '<div class="sources-meta"><span>内置测速源 <b>' + list.length + '</b> 条</span><span>来自该站点公开页面</span></div>' +
      '<div class="source-list">' + rows + '</div>' +
    '</div>';
  }

  function renderCard(site, index) {
    var tags = (site.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
    var defaults = site.defaults || [];
    var defaultRow = '';
    if (defaults.length) {
      var d = defaults[0];
      defaultRow = '<div class="default-box">' +
        '<div class="box-title">默认测试链接</div>' +
        '<div class="link-row">' +
          '<a class="link-url" href="' + escapeHtml(d.url) + '" target="_blank" rel="noopener" title="' + escapeHtml(d.url) + '">' + escapeHtml(d.url) + '</a>' +
          '<span class="link-actions">' +
            '<button type="button" class="btn btn-sm" data-action="copy" data-url="' + escapeHtml(d.url) + '">复制</button>' +
            '<a class="btn btn-sm" href="' + escapeHtml(d.url) + '" target="_blank" rel="noopener">打开</a>' +
          '</span>' +
        '</div>' +
      '</div>';
    }
    var isOpen = !!state.open[site.badge];
    return '<article class="site-card' + (site.badge === '主' ? ' is-main' : '') + '" data-index="' + index + '">' +
      '<div class="card-head">' +
        '<span class="badge">' + escapeHtml(site.badge) + '</span>' +
        '<div class="head-copy">' +
          '<h2>' + escapeHtml(site.name) + '</h2>' +
          '<a class="host" href="' + escapeHtml(site.url) + '" target="_blank" rel="noopener">' + escapeHtml(site.host) + ' ↗</a>' +
        '</div>' +
        '<div class="tags">' + tags + '</div>' +
      '</div>' +
      '<p class="desc">' + escapeHtml(site.desc) + '</p>' +
      '<div class="impl-row">' +
        '<span class="impl-key">实现</span>' +
        '<span class="impl-text">' + escapeHtml(site.impl) + '</span>' +
        '<span class="impl-thread">' + escapeHtml(site.threads) + '</span>' +
      '</div>' +
      defaultRow +
      '<div class="card-actions">' +
        '<a class="btn btn-primary" href="' + escapeHtml(site.url) + '" target="_blank" rel="noopener">打开站点</a>' +
        (defaults.length ? '<button type="button" class="btn" data-action="copy-default" data-index="' + index + '">复制默认链接</button>' : '') +
        '<button type="button" class="btn" data-action="toggle-sources" data-badge="' + escapeHtml(site.badge) + '" data-index="' + index + '">' +
          (isOpen ? '收起测速源' : '内置测速源 ' + (site.sources || []).length) +
        '</button>' +
        '<button type="button" class="btn" data-action="copy-site-sources" data-index="' + index + '">复制该站全部链接</button>' +
      '</div>' +
      '<div data-sources-host>' + (isOpen ? renderSources(site) : '') + '</div>' +
    '</article>';
  }

  function render() {
    var html = '';
    var visible = 0;
    for (var i = 0; i < sites.length; i++) {
      if (!matches(sites[i])) continue;
      html += renderCard(sites[i], i);
      visible++;
    }
    listEl.innerHTML = html;
    emptyEl.hidden = visible > 0;
    renderChips();
  }

  function updateThemeButtons() {
    var mode = document.documentElement.getAttribute('data-theme') || 'light';
    var buttons = document.querySelectorAll('[data-theme-btn]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-theme-btn') === mode ? 'true' : 'false');
    }
  }

  function setTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem('traffic.theme', mode); } catch (e) {}
    updateThemeButtons();
  }

  function sourcesText(sitesArr) {
    var lines = [];
    for (var i = 0; i < sitesArr.length; i++) {
      var s = sitesArr[i];
      var list = s.sources || [];
      for (var j = 0; j < list.length; j++) lines.push(list[j].url);
    }
    return lines.join('\n');
  }

  document.getElementById('statSources').textContent = totalSources();
  updateThemeButtons();
  render();

  chipsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter');
    render();
  });

  searchEl.addEventListener('input', function () {
    state.query = searchEl.value.trim();
    render();
  });

  document.getElementById('clearSearch').addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    render();
    searchEl.focus();
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'copy') {
      var url = btn.getAttribute('data-url') || '';
      copyText(url).then(function (ok) { toast(ok ? '链接已复制' : '复制失败，请手动选择'); });
      return;
    }
    if (action === 'copy-default') {
      var s1 = sites[Number(btn.getAttribute('data-index'))];
      var d = s1.defaults && s1.defaults[0];
      if (!d) return;
      copyText(d.url).then(function (ok) { toast(ok ? '默认测试链接已复制' : '复制失败，请手动选择'); });
      return;
    }
    if (action === 'copy-site-sources') {
      var s2 = sites[Number(btn.getAttribute('data-index'))];
      copyText(sourcesText([s2])).then(function (ok) { toast(ok ? '已复制 ' + (s2.sources || []).length + ' 条测速链接' : '复制失败，请手动选择'); });
      return;
    }
    if (action === 'toggle-sources') {
      var badge = btn.getAttribute('data-badge');
      var index = Number(btn.getAttribute('data-index'));
      var card = btn.closest('.site-card');
      var host = card.querySelector('[data-sources-host]');
      var opened = !!state.open[badge];
      if (opened) {
        state.open[badge] = false;
        host.innerHTML = '';
        btn.textContent = '内置测速源 ' + (sites[index].sources || []).length;
      } else {
        state.open[badge] = true;
        host.innerHTML = renderSources(sites[index]);
        btn.textContent = '收起测速源';
      }
    }
  });

  document.getElementById('copyAllSites').addEventListener('click', function () {
    var lines = sites.map(function (s) { return s.name + '  ' + s.url; });
    copyText(lines.join('\n')).then(function (ok) { toast(ok ? '已复制 9 个站点链接' : '复制失败，请手动选择'); });
  });

  document.getElementById('copyAllSources').addEventListener('click', function () {
    copyText(sourcesText(sites)).then(function (ok) { toast(ok ? '已复制全部 ' + totalSources() + ' 条测速链接' : '复制失败，请手动选择'); });
  });

  document.querySelector('.theme-switch').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-theme-btn]');
    if (!btn) return;
    setTheme(btn.getAttribute('data-theme-btn'));
  });

  window.addEventListener('scroll', function () {
    document.getElementById('appHeader').classList.toggle('is-scrolled', window.scrollY > 4);
  }, { passive: true });
})();
</script>
</body>
</html>
